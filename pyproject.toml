[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos"
version = "0.2.0"
description = "A production-grade multi-agent framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentOS Team" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

# Runtime dependencies of the wheel. requirements.txt stays the full dev/CI set.
# Heavy or optional backends are extras (spec principle 7); their adapters import
# them lazily and fall back with a warning when missing.
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.20.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "crewai>=1.15,<2",
    "litellm<2",
    "langchain-core>=0.1.30",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "cryptography>=41.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = ["torch>=2.0.0", "transformers>=4.35.0", "peft>=0.7.0", "bitsandbytes>=0.41.0"]
vector = ["faiss-cpu>=1.7.4", "chromadb>=0.4.0"]
postgres = ["psycopg2-binary>=2.9.0"]
# Platform mode storage (MongoDB via PyMongo's async API; Motor is deprecated upstream).
platform = ["pymongo>=4.13,<5"]
ui-legacy = ["streamlit>=1.40.0"]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "flake8>=6.1.0", "vcrpy>=6.0.0"]

# NOTE: keep setup.py temporarily in place for editable install compatibility.
# pyproject.toml is the authoritative metadata source going forward.
# The console_scripts entry point is duplicated here from setup.py.

[project.scripts]
agentos = "agentos.app:main"

# ---------------------------------------------------------------------------
# Built-in AgentOS extension points — these are the three groups third-party
# packages use to register their own subclasses without editing AgentOS source.
# ---------------------------------------------------------------------------

[project.entry-points."agentos.agents"]
Agent            = "agentos.core.agent:Agent"
ResearcherAgent  = "agentos.agents.researcher_agent:ResearcherAgent"
SecurityAgent    = "agentos.agents.security_agent:SecurityAgent"
ScriptAuthorAgent = "agentos.agents.script_author_agent:ScriptAuthorAgent"

[project.entry-points."agentos.tools"]
# (no standalone BaseTool classes ship at the top level yet;
#  tools live inside mcp_plugins/ at the project level)

[project.entry-points."agentos.mcp_plugins"]
# (project-local mcp_plugins/ scanning is the primary mechanism;
#  installed packages can register here for global availability)

[tool.setuptools.packages.find]
where = [".", "SWE"]
include = ["agentos*", "agentos_server*", "agentos_swe*"]

# Built React UI ships inside agentos_server (copied by `npm run build:package` in ui/).
[tool.setuptools.package-data]
agentos_server = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
pythonpath = [".", "SWE"]
testpaths = ["SWE/tests/swe"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E402",  # Module level import not at top of file
    "F841",  # Local variable assigned to but never used
    "F811",  # Redefinition of unused function
    "E501",  # Line too long
    "W291",  # Trailing whitespace
    "W293",  # Blank line contains whitespace
    "E722",  # Bare except
    "E712",  # Equality comparisons to True/False
    "F401",  # Unused imports (public api exposure)
]

