name: Release Package Build

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Python Package
        run: python -m build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: agentos/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: agentos/frontend
        run: npm install

      - name: Build Frontend Production Bundle
        working-directory: agentos/frontend
        run: npm run build
