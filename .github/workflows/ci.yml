name: CI Build & Lint

on:
  push:
    branches: [ main, framework ]
  pull_request:
    branches: [ main, framework ]

jobs:
  python-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff pip-audit

      - name: Run Tests with Coverage
        env:
          AGENTOS_MOCK_LLM: "1"
        run: |
          pytest --cov=agentos --cov-report=json

      - name: Enforce Core & LLM Coverage
        run: |
          python check_coverage.py

      - name: Run Python Linter (ruff)
        run: |
          ruff check agentos

      - name: Run Dependency Audit (pip-audit check for HIGH/CRITICAL)
        run: |
          python check_pip_audit.py

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: agentos/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: agentos/frontend
        run: npm install

      - name: Audit Frontend Dependencies
        working-directory: agentos/frontend
        run: npm audit

      - name: Run ESLint
        working-directory: agentos/frontend
        run: npm run lint

      - name: Type Check and Build Frontend
        working-directory: agentos/frontend
        run: npm run build
